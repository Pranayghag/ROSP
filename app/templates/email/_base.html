{#
  Shared email layout.

  Email clients strip <style> blocks unpredictably and ignore most modern CSS,
  so this uses a table skeleton with inline styles only -- the boring approach
  that actually renders the same in Gmail, Outlook and Apple Mail.

  Colours match the CampusCare "Academic Integrity" palette.
  Reusable pieces (buttons, field rows, pills) live in _components.html.
#}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ subject|default(app_name) }}</title>
</head>
<body style="margin:0; padding:0; background-color:#f9f9ff;
             font-family:'Segoe UI',Helvetica,Arial,sans-serif; color:#111c2c;">

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
         style="background-color:#f9f9ff; padding:24px 12px;">
    <tr>
      <td align="center">

        <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
               style="max-width:600px; background-color:#ffffff;
                      border:1px solid #c4c6cf; border-radius:12px; overflow:hidden;">

          <tr>
            <td style="background-color:#002045; padding:20px 28px;">
              <div style="color:#ffffff; font-size:20px; font-weight:700;
                          letter-spacing:-0.01em;">{{ app_name }}</div>
              <div style="color:#adc7f7; font-size:13px; margin-top:2px;">
                {{ app_tagline }}
              </div>
            </td>
          </tr>

          <tr>
            <td style="padding:28px;">
              {% block body %}{% endblock %}
            </td>
          </tr>

          <tr>
            <td style="background-color:#f0f3ff; padding:16px 28px;
                       border-top:1px solid #c4c6cf;">
              <p style="margin:0; font-size:12px; line-height:18px; color:#43474e;">
                This is an automated message from {{ app_name }}.
                {% block footer_note %}{% endblock %}
              </p>
            </td>
          </tr>

        </table>

        <p style="max-width:600px; margin:16px auto 0; font-size:11px;
                  line-height:16px; color:#74777f; text-align:center;">
          You are receiving this because your address is registered with
          {{ app_name }}. Never share your password or one-time code with
          anyone &mdash; {{ app_name }} staff will never ask for them.
        </p>

      </td>
    </tr>
  </table>

</body>
</html>
