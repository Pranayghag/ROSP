{% extends "base.html" %}
{% from "partials/_icons.html" import icon with context %}
{% block title %}Not Found{% endblock %}

{% block content %}
<div class="mx-auto text-center py-5" style="max-width: 520px;">
  <div class="empty-icon mb-3" style="width: 64px; height: 64px;">{{ icon('search', 30) }}</div>
  <div class="text-faint fw-bold" style="font-size: 56px; line-height: 1;">404</div>
  <h1 class="mt-3">That page does not exist</h1>
  <p class="text-muted mt-2">The link may be out of date, or the item may have been removed.</p>
  <a href="{{ url_for('main.index') }}" class="btn btn-primary mt-3">Go home</a>
</div>
{% endblock %}
