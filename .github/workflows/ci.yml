name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # The suite runs against a temporary SQLite file, so no database
      # service is needed here.
      - name: Run tests
        run: pytest -q

      - name: Check the generated schema is up to date
        # A model change that forgets to regenerate sql/schema.sql would
        # otherwise go unnoticed until someone tried to use the raw DDL.
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
        run: |
          python scripts/dump_schema.py
          git diff --exit-code sql/schema.sql

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Ruff
        run: ruff check app config.py run.py scripts tests
